<script>
function handleRegister() {
  const input = document.getElementById('curatorial-email');
  const ack = document.getElementById('acknowledgment');
  const btn = document.getElementById('submit-btn');

  if (input && input.value && input.value.includes('@')) {
    input.disabled = true;
    btn.disabled = true;
    btn.classList.add('opacity-80');
    btn.innerText = 'Đ&atilde; ghi nhận';
    if (ack) {
      ack.classList.remove('hidden');
      ack.classList.add('inline-flex');
    }
  } else if (input) {
    input.focus();
  }
}
