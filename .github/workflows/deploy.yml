name: Deploy

# Builds the five linux/arm64 images, pushes them to GHCR tagged with the commit SHA, then
# deploys them on the Oracle Cloud server over SSH (docs/runbooks/deploy-oracle.md).
#   - push of a tag v*          → build and deploy that commit
#   - Run workflow (manual)     → build and deploy the selected ref; with `image_tag`, skip
#                                 the build and redeploy an existing tag (rollback)
#
# Repository variables: NEXT_PUBLIC_SITE_URL, NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME (public).
# Secrets of the "production" environment: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY,
# DEPLOY_KNOWN_HOSTS. No application secret ever passes through this workflow: they live
# in /opt/lavieco/env on the server.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing image tag (commit SHA) to redeploy or roll back to. Empty = build the selected ref."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'push' || inputs.image_tag == '' }}
    # Native arm64 runner (free for public repositories): no QEMU emulation.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: web
            dockerfile: apps/web/Dockerfile
          - name: admin
            dockerfile: apps/admin/Dockerfile
          - name: identity-service
            dockerfile: services/identity-service/Dockerfile
          - name: content-service
            dockerfile: services/content-service/Dockerfile
          - name: program-service
            dockerfile: services/program-service/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Check public build variables
        if: ${{ matrix.name == 'web' || matrix.name == 'admin' }}
        env:
          CLOUD_NAME: ${{ vars.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
        run: |
          if [ -z "$CLOUD_NAME" ]; then
            echo "::error::Repository variable NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME is not set"
            exit 1
          fi

      - name: Image name
        id: image
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lavieco-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.image.outputs.ref }}:${{ github.sha }}
          # Public values inlined into web/admin; ignored by the service images.
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://lavieco.io.vn' }}
            NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${{ vars.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-24.04
    # Add required reviewers to this environment for the approval step of docs/02 §12.4.
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          tag="${INPUT_TAG:-$GITHUB_SHA}"
          if [[ ! "$tag" =~ ^[A-Za-z0-9._-]{1,128}$ ]]; then
            echo "::error::Invalid image tag"
            exit 1
          fi
          echo "value=$tag" >> "$GITHUB_OUTPUT"

      - name: SSH setup
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key: no trust-on-first-use from the runner.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host lavieco\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n' \
            "$DEPLOY_HOST" "$DEPLOY_USER" > ~/.ssh/config

      - name: Upload compose, Caddyfile and scripts
        run: rsync -az --delete infra/compose infra/caddy infra/deploy lavieco:/opt/lavieco/infra/

      - name: Deploy
        env:
          TAG: ${{ steps.tag.outputs.value }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Short-lived registry login for this pull only (the job token expires with the job).
          printf '%s' "$GHCR_TOKEN" | ssh lavieco "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          trap 'ssh lavieco "docker logout ghcr.io" || true' EXIT
          ssh lavieco "bash /opt/lavieco/infra/deploy/scripts/deploy.sh '$TAG'"

      - name: Summary
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: echo "Deployed image tag \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
