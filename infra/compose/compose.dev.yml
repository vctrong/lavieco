# Local infrastructure for development (docs/04 §11.1): `npm run dev:infra`.
# Every port is bound to 127.0.0.1 only. The apps and services themselves run with
# `npm run dev` on the host. Values come from the root `.env.local` (see `.env.example`).
name: lavieco-dev

services:
  mongo:
    image: mongo:8.0
    # Single-node replica set: transactions (outbox, state changes) need one (docs/02 §8.1).
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first start, then reports healthy once it is PRIMARY.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] }).ok }; db.hello().isWritablePrimary ? 0 : 1"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env.local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env.local}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    # Catches every outgoing email; web UI on http://localhost:8025.
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mongo-data:
  minio-data:
