<!doctype html>
<!--
  Served by the service worker when a page cannot load (docs/PWA.md). Static on purpose:
  it must work with no network and no app bundle. Colors are copies of theme.css tokens
  (deep-blue, soft-white, charcoal, emerald-brand), like PWA_COLORS.
-->
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f8faf6" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Mất kết nối · LAVIECO</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #f8faf6;
        color: #1e2a32;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        box-sizing: border-box;
      }
      main {
        max-width: 22rem;
        text-align: center;
      }
      img {
        width: 64px;
        height: 64px;
        border-radius: 16px;
      }
      h1 {
        font-family: Georgia, serif;
        font-weight: 500;
        color: #20345f;
        font-size: 1.6rem;
        margin: 20px 0 8px;
      }
      p {
        line-height: 1.55;
        margin: 0 0 24px;
      }
      button {
        min-height: 48px;
        padding: 0 28px;
        border: 0;
        border-radius: 999px;
        background: #10b183;
        color: #1e2a32;
        font: inherit;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="LAVIECO" />
      <h1>Đang mất kết nối</h1>
      <p>Không tải được trang. Kiểm tra Wi-Fi hoặc dữ liệu di động rồi thử lại.</p>
      <button type="button" onclick="location.reload()">Thử lại</button>
    </main>
  </body>
</html>
